coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 5%
    patch:
      default:
        target: 70%
        threshold: 10%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false

ignore:
  - "Assets/Plugins/**"
  - "Assets/TJGenerators/**"
  - "Library/**"
  - "Packages/**"
