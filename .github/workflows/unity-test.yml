name: Unity Test CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  UNITY_VERSION: '2022.3.48f1'
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

permissions:
  checks: write
  contents: read

jobs:
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch project for standard Unity
        run: |
          chmod +x scripts/patch-for-ci.sh
          bash scripts/patch-for-ci.sh .
          cat ProjectSettings/ProjectVersion.txt

      - name: Run Unity EditMode Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: .
          testMode: EditMode
          artifactsPath: test-results/editmode
          checkName: EditMode Test Results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: test-results/editmode/
          retention-days: 30

  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch project for standard Unity
        run: |
          chmod +x scripts/patch-for-ci.sh
          bash scripts/patch-for-ci.sh .
          cat ProjectSettings/ProjectVersion.txt

      - name: Run Unity PlayMode Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: .
          testMode: PlayMode
          artifactsPath: test-results/playmode
          checkName: PlayMode Test Results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-test-results
          path: test-results/playmode/
          retention-days: 30

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch project for standard Unity
        run: |
          chmod +x scripts/patch-for-ci.sh
          bash scripts/patch-for-ci.sh .

      - name: Run tests with coverage
        id: tests
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: .
          testMode: EditMode
          artifactsPath: test-results/coverage
          coverageEnabled: true
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert coverage to Cobertura
        if: always()
        run: |
          set +e
          echo "=== Installing reportgenerator ==="
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          
          echo "=== Searching entire workspace for coverage files ==="
          find . -name "*coverage*" -o -name "*Coverage*" 2>/dev/null | head -50
          
          echo "=== Searching for all XML files in workspace ==="
          find . -name "*.xml" -type f 2>/dev/null | grep -v node_modules | grep -v Library | head -50
          
          echo "=== test-results/coverage directory listing ==="
          find test-results/coverage -type f 2>/dev/null
          
          echo "=== Looking for CodeCoverage output folder ==="
          find . -type d -name "CodeCoverage" 2>/dev/null | head -10
          
          # Find coverage XML files (Unity coverage format, not test results)
          # Exclude test result files (*-results.xml)
          COVERAGE_FILES=$(find . -name "*.xml" -path "*coverage*" -not -name "*-results.xml" 2>/dev/null | tr '\n' ';')
          
          if [ -z "$COVERAGE_FILES" ]; then
            # Try finding coverage XML in common locations
            COVERAGE_FILES=$(find . -name "coverage*.xml" -not -name "*-results.xml" 2>/dev/null | tr '\n' ';')
          fi
          
          echo "=== Coverage files to convert: $COVERAGE_FILES ==="
          
          if [ -n "$COVERAGE_FILES" ]; then
            reportgenerator \
              -reports:"$COVERAGE_FILES" \
              -targetdir:coverage-report \
              -reporttypes:Cobertura
            echo "=== Coverage report generated ==="
            ls -la coverage-report/
          else
            echo "WARNING: No coverage XML files found, creating empty report"
            mkdir -p coverage-report
            # Create a minimal Cobertura XML so Codecov doesn't error
            echo '<?xml version="1.0" encoding="utf-8"?><coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0" version="0" timestamp="0"><packages/></coverage>' > coverage-report/Cobertura.xml
          fi
          set -e

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-report/Cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30
