name: Unity Test CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  UNITY_VERSION: '2022.3.48f1'

permissions:
  checks: write
  contents: read

jobs:
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch project for standard Unity
        run: |
          chmod +x scripts/patch-for-ci.sh
          bash scripts/patch-for-ci.sh .
          cat ProjectSettings/ProjectVersion.txt

      - name: Run Unity EditMode Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: .
          testMode: EditMode
          artifactsPath: test-results/editmode
          checkName: EditMode Test Results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: test-results/editmode/
          retention-days: 30

  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch project for standard Unity
        run: |
          chmod +x scripts/patch-for-ci.sh
          bash scripts/patch-for-ci.sh .
          cat ProjectSettings/ProjectVersion.txt

      - name: Run Unity PlayMode Tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: .
          testMode: PlayMode
          artifactsPath: test-results/playmode
          checkName: PlayMode Test Results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-test-results
          path: test-results/playmode/
          retention-days: 30

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch project for standard Unity
        run: |
          chmod +x scripts/patch-for-ci.sh
          bash scripts/patch-for-ci.sh .

      - name: Run tests with coverage
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: .
          testMode: EditMode
          artifactsPath: test-results/coverage
          coverageEnabled: true
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear;assemblyFilters:+Assembly-CSharp,+Pong
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert coverage to Cobertura
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          
          # Find OpenCover format coverage XML files from Unity Code Coverage package
          COVERAGE_FILES=$(find CodeCoverage -name "TestCoverageResults_*.xml" 2>/dev/null | tr '\n' ';')
          
          if [ -n "$COVERAGE_FILES" ]; then
            reportgenerator \
              -reports:"$COVERAGE_FILES" \
              -targetdir:coverage-report \
              -reporttypes:Cobertura
            echo "Coverage report generated successfully"
          else
            echo "WARNING: No coverage XML files found"
            mkdir -p coverage-report
            echo '<?xml version="1.0" encoding="utf-8"?><coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0" version="0" timestamp="0"><packages/></coverage>' > coverage-report/Cobertura.xml
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-report/Cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30
